<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhwani 26 | Theme Reveal Puzzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <img src="Elements/mascot%20mask.svg" alt="Loading..." class="loading-mascot" />
  </div>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="app-container">
    <!-- Top Brand Header -->
    <header class="brand-header">
      <div class="brand-identity">
        <img 
          src="Elements/dhwani%20og%2026.png" 
          alt="Dhwani 26" 
          class="dhwani-logo-text" 
          draggable="false"
        />
      </div>
    </header>

    <!-- Massive Puzzle Container -->
    <section class="frame-wrapper">
      <div class="frame-container pc-mode" id="frame-container">
        <!-- 12 Cards Grid (Zero Gap, completely blank pure pink backs) -->
        <div class="puzzle-grid" id="puzzle-grid">
          <!-- Dynamically generated 12 tiles -->
        </div>

        <!-- Wooden Frame Border Overlay -->
        <img 
          src="Elements/Border_pc.png" 
          alt="Puzzle Frame Border" 
          class="frame-overlay-img" 
          id="frame-overlay-img" 
          draggable="false" 
        />


      </div>
      <div class="frame-drop-shadow"></div>
    </section>
    
    <div class="bottom-controls">
      <button class="btn btn-restart" id="btn-restart">Restart</button>
    </div>
  </main>

  <canvas id="confetti-canvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
